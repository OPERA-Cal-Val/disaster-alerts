# config/app.yaml
# Core application settings (no scheduling here — use cron/)
# Log level: CRITICAL | ERROR | WARNING | INFO | DEBUG
log_level: INFO

# Area of Interest (GeoJSON) — set to null to include all events.
# Example Polygon (a simple box around Southern California):
# aoi:
#   type: Polygon
#   coordinates:
#     - [[-124.5, 32.0], [-114.0, 32.0], [-114.0, 37.5], [-124.5, 37.5], [-124.5, 32.0]]
aoi: null

# Web map only: days of past NWS warnings to include (0 = active only; NWS keeps
# at most 7 days). Also sets how far back earthquakes go (7 days when 0).
# E-mail alerts are unaffected. Override per run: disaster-alerts-export -k DAYS
lookback_days: 7

# Enable/disable data sources
providers:
  nws: true    # National Weather Service alerts
  usgs: true   # USGS earthquakes

routing:
  force_group: default      # send *all* events to this group
